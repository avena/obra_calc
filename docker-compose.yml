# docker-compose.yml — Obra Calc Backend (Lumen + MariaDB)
#
# 3 serviços (Ticket 01):
#   app  = PHP-FPM 8.x (Lumen) — expõe 9000 internamente (não publica no host)
#   web  = Apache httpd 2.4   (proxy reverso FastCGI → app:9000, docroot public/) — publica 8084
#   db   = MariaDB            — publica 3306, credenciais via .env
#
# Estrutura espelhando o DreamHost: public/ como docroot, .env e vendor/ fora do docroot.
#
# Uso:   just lumen-up   (sobe)   |   just lumen-down   (derruba)
# Acesso: http://localhost:8084

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: obra-calc-lumen-php-fpm:latest
    container_name: obra-calc-lumen-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Código do projeto mapeado para o container (inclui public/, vendor/, .env)
      - .:/var/www/html:cached
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: httpd:2.4-alpine
    container_name: obra-calc-lumen-web
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/apache/httpd-fpm.conf:/usr/local/apache2/conf/extra/httpd-fpm.conf:ro
    command: >
      sh -c "
      sed -i 's/^#LoadModule proxy_module/LoadModule proxy_module/;
              s/^#LoadModule proxy_fcgi_module/LoadModule proxy_fcgi_module/;
              s/^#LoadModule rewrite_module/LoadModule rewrite_module/' /usr/local/apache2/conf/httpd.conf &&
      grep -q 'extra/httpd-fpm.conf' /usr/local/apache2/conf/httpd.conf ||
        echo 'Include conf/extra/httpd-fpm.conf' >> /usr/local/apache2/conf/httpd.conf &&
      httpd-foreground"
    depends_on:
      - app

  db:
    image: mariadb:10.6
    container_name: obra-calc-lumen-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - obra_calc_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: obra-calc-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  obra_calc_db_data:
