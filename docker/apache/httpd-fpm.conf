# httpd-fpm.conf — vhost/proxy do container `web` (httpd:2.4-alpine)
#
# Arquitetura Ticket 01: Apache serve estáticos de public/ (docroot do Lumen)
# e despacha PHP via FastCGI para o container `app` (app:9000). Ambos montam
# a raiz do projeto (.:/var/www/html), então o path repassado existe nos dois lados.
# Incluído no httpd.conf pelo `command:` do docker-compose.yml (idempotente).
# Módulos habilitados no mesmo command: proxy, proxy_fcgi, rewrite.

ServerName localhost

DocumentRoot "/var/www/html/public"
DirectoryIndex index.php index.html

<Directory "/var/www/html/public">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Rewrites do Lumen: tudo que não é arquivo/diretório existente vai para index.php
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteBase /
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L]
</IfModule>

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://app:9000"
</FilesMatch>
