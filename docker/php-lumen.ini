; php-lumen.ini — diretivas PHP para o container app (Lumen + MariaDB)
; Carrega por último (prefixo zz-) para sobrescrever os defaults da imagem.

; ── Memória e upload ──
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
max_input_vars = 3000
output_buffering = 0

; ── Execução ──
max_execution_time = 120
max_input_time = -1
implicit_flush = Off
ignore_user_abort = Off

; ── Datas e charset ──
date.timezone = America/Sao_Paulo
default_charset = UTF-8

; ── Erros (dev: exibe para facilitar depuração; ajuste em produção) ──
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
expose_php = Off

; ── CGI / FastCGI ──
cgi.fix_pathinfo = On
short_open_tag = On
fastcgi.logging = On

; ── mbstring ──
mbstring.language = neutral
mbstring.internal_encoding = UTF-8
mbstring.http_input = UTF-8
mbstring.http_output = UTF-8
mbstring.detect_order = UTF-8,ISO-8859-1
mbstring.substitute_character = none

; ── intl ──
intl.default_locale = pt_BR
intl.use_exceptions = On

; ── bcmath ──
bcmath.scale = 6

; ── OpenSSL ──
openssl.cafile =
openssl.capath =
